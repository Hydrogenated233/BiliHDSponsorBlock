plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'top.local.bilihdskip'
    compileSdk 35
    defaultConfig {
        applicationId 'top.local.bilihdskip'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '0.3.0-hd2.2.0'
    }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] }
        test { java.srcDirs = ['tests-junit', 'tests'] }
    }
    signingConfigs {
        localRelease { storeFile file('.signing/module.p12'); storePassword 'android'; keyAlias 'module'; keyPassword 'android' }
    }
    // Public source builds use their local debug key unless a private release key exists.
    buildTypes { release { signingConfig file('.signing/module.p12').exists() ? signingConfigs.localRelease : signingConfigs.debug; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES']; resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    compileOnly files('tools/xposed-api.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
